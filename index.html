<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No maximum-scale and no user-scalable=no, on purpose. iOS zooms when it
     focuses a sub-16px text field, and the fix is the 16px font floor on the
     form controls, not locking the user's pinch-zoom. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallboard</title>
<style>
  /* Stop Safari inflating the vmin-based type in landscape, which otherwise
     makes the wall layout drift between orientations. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  :root {
    --bg: #0b0e14;
    --panel: #121722;
    --panel-2: #171e2b;
    --fg: #e8ecf3;
    --muted: #8494ab;
    --accent: #6ea8ff;
    --border: #1e2634;
    --today: #6ea8ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
    padding: 2.4vmin 3vmin 2vmin;
    overflow: hidden;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 4vmin; padding-bottom: 1.4vmin; border-bottom: 1px solid var(--border);
  }
  #clock { font-size: 8vmin; font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; }
  #date { font-size: 3.2vmin; color: var(--muted); font-weight: 300; }
  #sync { font-size: 1.8vmin; color: var(--muted); text-align: right; }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 1.6vmin;
    padding: 1.2vmin 0; border-bottom: 1px solid var(--border);
  }
  .tabs { display: flex; gap: 0.6vmin; background: var(--panel); padding: 0.5vmin; border-radius: 999px; }
  .tab {
    background: transparent; color: var(--muted); border: 0; cursor: pointer;
    font: inherit; font-size: 1.9vmin; padding: 0.7vmin 2vmin; border-radius: 999px;
  }
  .tab.active { background: var(--accent); color: #061021; font-weight: 600; }
  .nav { display: flex; align-items: center; gap: 0.6vmin; margin-left: auto; }
  .nav button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--border);
    width: 4vmin; height: 4vmin; border-radius: 0.8vmin; cursor: pointer;
    font-size: 2vmin; line-height: 1; display: grid; place-items: center;
  }
  .nav button:hover { background: var(--panel-2); }
  .nav .today { width: auto; padding: 0 1.6vmin; font-size: 1.8vmin; }
  .range-label { font-size: 2.2vmin; font-weight: 600; min-width: 26vmin; text-align: center; }

  /* ---------- calendar filters ---------- */
  .filters { display: flex; flex-wrap: wrap; gap: 0.8vmin; padding: 1.1vmin 0 0.2vmin; }
  .chip {
    display: inline-flex; align-items: center; gap: 0.9vmin;
    background: var(--panel); color: var(--fg); border: 1px solid var(--c, var(--border));
    font: inherit; font-size: 1.8vmin; padding: 0.5vmin 1.5vmin; border-radius: 999px; cursor: pointer;
  }
  .chip .dot { width: 1.3vmin; height: 1.3vmin; border-radius: 999px; background: var(--c); flex-shrink: 0; }
  .chip:hover { background: var(--panel-2); }
  .chip.off { opacity: 0.38; border-color: var(--border); }
  .chip.off .dot { background: var(--muted); }

  /* ---------- modal move control ---------- */
  .modal-card select {
    background: var(--panel-2); color: var(--fg); border: 1px solid var(--border);
    /* 16px floor for the same iOS focus-zoom reason as the text fields. */
    font: inherit; font-size: max(16px, 2.1vmin); padding: max(8px, 0.7vmin) 1.2vmin; border-radius: 0.7vmin;
    width: 100%; cursor: pointer;
  }
  .move-msg { font-size: 1.9vmin; margin-top: 1vmin; }
  .move-msg.err { color: #ff8b8b; }
  .move-msg.ok { color: #7ee0a1; }
  .ro { color: var(--muted); font-size: max(12px, 1.8vmin); }

  main { flex: 1; overflow: hidden; margin-top: 1.4vmin; display: flex; }

  /* ---------- agenda ---------- */
  .agenda { flex: 1; overflow-y: auto; padding-right: 1vmin; }
  .agenda-day { margin-bottom: 2.2vmin; }
  .day-head {
    display: flex; align-items: baseline; gap: 1.6vmin; margin-bottom: 0.9vmin;
    color: var(--accent); font-size: 2.6vmin; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.07em;
  }
  .day-head.today { color: var(--today); }
  .day-head .count { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }
  .day-strip {
    position: relative; height: 2.4vmin; background: var(--panel);
    border-radius: 0.5vmin; margin-bottom: 1vmin; overflow: hidden;
  }
  .strip-block { position: absolute; top: 0; bottom: 0; border-radius: 0.4vmin; opacity: 0.95; cursor: pointer; }
  .strip-block:hover { outline: 2px solid var(--fg); }
  .strip-tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border); }
  .strip-label { position: absolute; top: 0; bottom: 0; font-size: 1vmin; color: var(--muted); padding-left: 0.4vmin; display: flex; align-items: center; }

  .event {
    display: flex; align-items: center; gap: 2vmin;
    padding: 1vmin 1.6vmin; margin-bottom: 0.8vmin; cursor: pointer;
    background: var(--panel);
    border-left: 0.7vmin solid var(--cal-color, var(--accent));
    border-radius: 0 1vmin 1vmin 0;
  }
  .event:hover { background: var(--panel-2); }
  .event .time { min-width: 13vmin; font-size: 2.4vmin; color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .event .title { font-size: 3.2vmin; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .event .title .sub { font-size: 1.8vmin; color: var(--muted); font-weight: 400; }
  .event .dur { font-size: 2vmin; color: var(--muted); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .event .dur-bar { width: 10vmin; height: 0.9vmin; background: var(--border); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
  .event .dur-bar > i { display: block; height: 100%; background: var(--cal-color, var(--accent)); }
  .event .cal { font-size: 1.9vmin; color: var(--muted); flex-shrink: 0; padding: 0.3vmin 1.2vmin; border-radius: 999px; border: 1px solid var(--border); }
  .event.all-day .time { color: var(--cal-color); }

  /* ---------- week ---------- */
  .week { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .wk-head { display: grid; grid-template-columns: 6vmin repeat(7, 1fr); padding-bottom: 0.6vmin; }
  .wk-day-head { text-align: center; font-size: 1.9vmin; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .wk-day-head .num { display: block; font-size: 2.8vmin; color: var(--fg); font-weight: 600; letter-spacing: 0; }
  .wk-day-head.today .num, .wk-day-head.today { color: var(--today); }
  .wk-allday { display: grid; grid-template-columns: 6vmin repeat(7, 1fr); gap: 0.3vmin; margin-bottom: 0.6vmin; }
  .wk-allday-cell { min-height: 2.4vmin; display: flex; flex-direction: column; gap: 0.3vmin; }
  .wk-allday-chip {
    font-size: 1.4vmin; padding: 0.2vmin 0.7vmin; border-radius: 0.4vmin; cursor: pointer;
    color: #061021; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .wk-body { flex: 1; display: grid; grid-template-columns: 6vmin repeat(7, 1fr); overflow-y: auto; position: relative; }
  .wk-gutter { position: relative; }
  .wk-hour-label { position: absolute; right: 0.8vmin; transform: translateY(-50%); font-size: 1.4vmin; color: var(--muted); font-variant-numeric: tabular-nums; }
  .wk-col { position: relative; border-left: 1px solid var(--border); }
  .wk-gridline { position: absolute; left: 0; right: 0; height: 1px; background: var(--border); opacity: 0.55; }
  .wk-block {
    position: absolute; left: 0.3vmin; right: 0.3vmin; border-radius: 0.5vmin;
    padding: 0.4vmin 0.7vmin; font-size: 1.6vmin; overflow: hidden; cursor: pointer;
    border-left: 0.5vmin solid rgba(0,0,0,0.35);
  }
  .wk-block .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wk-block .s { opacity: 0.85; font-size: 1.3vmin; white-space: nowrap; }
  .wk-block:hover { outline: 2px solid var(--fg); }

  /* ---------- month ---------- */
  .month { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .mo-dow { display: grid; grid-template-columns: repeat(7, 1fr); padding-bottom: 0.6vmin; }
  .mo-dow span { text-align: center; font-size: 1.8vmin; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .mo-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; gap: 0.4vmin; overflow: hidden; }
  .mo-cell {
    background: var(--panel); border-radius: 0.7vmin; padding: 0.6vmin 0.8vmin;
    display: flex; flex-direction: column; gap: 0.3vmin; overflow: hidden; min-height: 0;
    border: 1px solid transparent;
  }
  .mo-cell.out { opacity: 0.45; }
  .mo-cell.today { border-color: var(--today); }
  .mo-date { font-size: 1.9vmin; font-weight: 600; color: var(--muted); flex-shrink: 0; }
  .mo-cell.today .mo-date { color: var(--today); }
  .mo-chip {
    font-size: 1.35vmin; padding: 0.2vmin 0.6vmin; border-radius: 0.35vmin; cursor: pointer;
    background: var(--panel-2); border-left: 0.4vmin solid var(--c, var(--accent));
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0;
  }
  .mo-chip .ct { color: var(--muted); margin-right: 0.5vmin; }
  .mo-more { font-size: 1.25vmin; color: var(--accent); cursor: pointer; flex-shrink: 0; }

  .empty, .error { color: var(--muted); font-size: 3.4vmin; text-align: center; margin: auto; }
  .empty .big { font-size: 5vmin; color: var(--fg); margin-bottom: 1vmin; }
  .error { color: #ff8b8b; font-size: 2.6vmin; }

  /* ---------- modal ---------- */
  .modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; }
  .modal[hidden] { display: none; }
  .modal-backdrop { position: absolute; inset: 0; background: rgba(4,7,12,0.72); }
  .modal-card {
    position: relative; width: min(70vmin, 92vw); max-height: 86vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 1.6vmin;
    padding: 3.2vmin 3.4vmin 3vmin; box-shadow: 0 3vmin 8vmin rgba(0,0,0,0.6);
  }
  .modal-accent { position: absolute; left: 0; top: 0; bottom: 0; width: 0.9vmin; border-radius: 1.6vmin 0 0 1.6vmin; }
  .modal-x {
    position: absolute; top: 1.6vmin; right: 1.6vmin; background: var(--panel-2); color: var(--fg);
    border: 1px solid var(--border); width: 4.4vmin; height: 4.4vmin; border-radius: 0.8vmin;
    cursor: pointer; font-size: 2.2vmin; line-height: 1;
  }
  .modal-card h2 { font-size: 4vmin; font-weight: 600; margin-right: 5vmin; line-height: 1.15; }
  .modal-cal { display: inline-block; margin-top: 1vmin; font-size: 1.9vmin; color: var(--muted);
    padding: 0.3vmin 1.2vmin; border-radius: 999px; border: 1px solid var(--border); }
  .modal-card dl { margin-top: 2.4vmin; display: flex; flex-direction: column; gap: 1.6vmin; }
  .modal-card .row { display: flex; gap: 1.6vmin; }
  .modal-card dt { width: 12vmin; flex-shrink: 0; color: var(--muted); font-size: 1.8vmin; text-transform: uppercase; letter-spacing: 0.05em; padding-top: 0.2vmin; }
  .modal-card dd { font-size: 2.3vmin; line-height: 1.35; flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .modal-card a.gcal {
    display: inline-block; margin-top: 2.6vmin; color: var(--accent); font-size: 2vmin; text-decoration: none;
    border: 1px solid var(--border); padding: 0.9vmin 1.8vmin; border-radius: 0.8vmin;
  }
  .modal-card a.gcal:hover { background: var(--panel-2); }

  /* ---------- responsive: small screens ----------
     Everything above is sized in vmin, which assumes a big wall panel. On a
     phone vmin is ~4px, so controls collapse to ~16px and text to ~12px. This
     block re-sizes the UI for touch and lets the page scroll normally. */
  @media (max-width: 820px) {
    body { padding: 12px 12px 10px; overflow: auto; }
    header { flex-wrap: wrap; gap: 6px; padding-bottom: 10px; }
    #clock { font-size: clamp(2.6rem, 12vw, 4rem); }
    #date { font-size: 1.05rem; }
    #sync { font-size: 0.8rem; text-align: left; }

    .toolbar { flex-wrap: wrap; gap: 8px; padding: 10px 0; }
    .tabs { padding: 4px; gap: 4px; }
    .tab { font-size: 0.95rem; padding: 12px 14px; }
    .nav { margin-left: 0; width: 100%; gap: 8px; }
    .nav button { width: 48px; height: 48px; font-size: 1.4rem; border-radius: 10px; flex-shrink: 0; }
    .nav .today { flex: 1; font-size: 0.95rem; }
    .range-label { font-size: 0.95rem; min-width: 0; flex: 1; }

    .filters { gap: 8px; padding: 10px 0 4px; }
    .chip { font-size: 0.95rem; padding: 12px 16px; gap: 8px; }
    .chip .dot { width: 12px; height: 12px; }

    main { overflow: visible; margin-top: 12px; }
    .agenda { overflow: visible; padding-right: 0; }
    .agenda-day { margin-bottom: 20px; }
    .day-head { font-size: 1.15rem; gap: 10px; margin-bottom: 10px; }
    .day-head .count { font-size: 0.9rem; }
    .day-strip { height: 14px; margin-bottom: 10px; }
    .strip-label { font-size: 9px; }
    .event { padding: 14px; gap: 12px; border-left-width: 5px; border-radius: 0 10px 10px 0; }
    .event .time { font-size: 0.95rem; min-width: 74px; }
    .event .title { font-size: 1.1rem; white-space: normal; }
    .event .title .sub { display: block; font-size: 0.85rem; }
    .event .dur { font-size: 0.85rem; }
    .event .dur-bar { width: 56px; height: 6px; }
    .event .cal { font-size: 0.8rem; }

    /* 7 proportional columns don't fit a phone: scroll the week sideways
       with a usable minimum column width. */
    .week { overflow-x: auto; overflow-y: hidden; }
    .wk-head, .wk-allday, .wk-body { min-width: 700px; }
    .wk-day-head { font-size: 0.8rem; }
    .wk-day-head .num { font-size: 1.2rem; }
    .wk-allday-chip { font-size: 0.75rem; }
    .wk-block { font-size: 0.8rem; }
    .wk-block .s { font-size: 0.7rem; }
    .wk-hour-label { font-size: 0.7rem; }

    .month { overflow: visible; }
    .mo-dow span { font-size: 0.7rem; }
    .mo-grid { gap: 2px; }
    .mo-cell { padding: 5px 4px; gap: 2px; }
    .mo-date { font-size: 0.85rem; }
    .mo-chip { font-size: 0.65rem; padding: 2px 4px; }
    .mo-more { font-size: 0.65rem; }

    .empty { font-size: 1.3rem; }
    .empty .big { font-size: 2rem; margin-bottom: 8px; }
    .error { font-size: 1.05rem; }

    .modal-card { width: min(94vw, 560px); padding: 22px 18px 18px; border-radius: 14px; }
    .modal-accent { width: 6px; border-radius: 14px 0 0 14px; }
    .modal-x { width: 44px; height: 44px; font-size: 1.4rem; top: 12px; right: 12px; }
    .modal-card h2 { font-size: 1.5rem; margin-right: 48px; }
    .modal-cal { font-size: 0.85rem; }
    .modal-card dl { margin-top: 18px; gap: 14px; }
    .modal-card .row { flex-direction: column; gap: 2px; }
    .modal-card dt { width: auto; font-size: 0.72rem; }
    .modal-card dd { font-size: 1rem; }
    .modal-card select { font-size: 1rem; padding: 12px; }
    .move-msg, .ro { font-size: 0.85rem; }
    .modal-card a.gcal { font-size: 0.9rem; padding: 13px 16px; }
    /* The add menu on a phone: keep the panel off the screen edge and the rows
       thumb-sized. Width is already clamped to 86vw in the base rule. */
    .add-menu { right: 12px; bottom: calc(12px + 52px + 10px); }
    .menu-item { min-height: 48px; }
  }

  /* Touch devices: no hover highlight, and keep tap targets finger-sized. */
  @media (hover: none) and (max-width: 820px) {
    .event, .strip-block, .wk-block, .mo-chip, .wk-allday-chip { cursor: default; }
  }

  @media (min-width: 821px) and (max-width: 1200px) {
    .nav button { width: 40px; height: 40px; font-size: 1.4rem; }
    .tab { padding: 10px 16px; }
  }

  ::-webkit-scrollbar { width: 0.9vmin; height: 0.9vmin; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 1vmin; }

  /* ---- Tasks panel ------------------------------------------------------ */
  .tasks-wrap { display: flex; flex-direction: column; gap: 1.1vmin; height: 100%; }
  .tasks-head {
    display: flex; align-items: baseline; gap: 1.4vmin; padding-bottom: 0.8vmin;
    border-bottom: 0.15vmin solid var(--border);
  }
  .tasks-title { font-size: 2.6vmin; font-weight: 600; }
  .tasks-count { font-size: 1.8vmin; color: var(--muted); }
  .task-row {
    display: grid; grid-template-columns: 3.2vmin 1fr auto; align-items: baseline;
    gap: 1.2vmin; padding: 0.9vmin 0.6vmin; border-radius: 0.8vmin;
    border-bottom: 0.1vmin solid var(--border);
  }
  /* Overdue is the only state that earns colour; everything else stays neutral
     so a glance at the wall reads as "these are the problems". */
  .task-row.overdue .task-title { color: #ff8b8b; }
  .task-row.overdue .task-due { color: #ff8b8b; }
  .task-row.due-today .task-due { color: #fbbc05; }
  .task-box {
    width: 2.2vmin; height: 2.2vmin; border-radius: 0.5vmin;
    border: 0.25vmin solid var(--muted); display: inline-block;
  }
  .task-title { font-size: 2.1vmin; word-break: break-word; }
  .task-row.overdue .task-box { border-color: #ff8b8b; }
  .task-due { font-size: 2.1vmin; color: var(--muted); white-space: nowrap; }
  .task-sub { font-size: 1.7vmin; color: var(--muted); }
  .tasks-note { font-size: 1.9vmin; color: var(--muted); margin-top: 0.3vmin; }
  /* Creating a task goes through a modal, not a field parked on the wall: the
     list is a read-only glanceable surface and a stray Enter should not be able
     to add a half-typed task to the household list. The add control itself now
     lives in the toolbar (.add-global) so it sits in the same spot on every
     view; only its label and its target change. */
  .task-form { display: flex; flex-direction: column; gap: 1.2vmin; margin-top: 2.4vmin; }
  .task-form textarea {
    /* 16px floor is not cosmetic: iOS Safari zooms the whole viewport when it
       focuses a text field whose computed font-size is under 16px. At 2.3vmin
       this is ~9px on a phone, so opening a dialog used to yank the page into
       a magnified, scrolling mess. max() clamps the small end while still
       scaling up on a wall panel. Do NOT "fix" this with maximum-scale=1 or
       user-scalable=no in the viewport meta; that blocks pinch-zoom for
       everyone, which is worse than the problem. */
    font: inherit; font-size: max(16px, 2.3vmin); padding: 1.2vmin 1.4vmin; line-height: 1.35;
    border-radius: 0.8vmin; border: 0.15vmin solid var(--border);
    background: var(--panel-2); color: var(--fg); outline: none;
    resize: vertical; min-height: max(88px, 8vmin); width: 100%;
  }
  .task-form textarea:focus { border-color: var(--accent); }
  .task-form-actions { display: flex; justify-content: flex-end; gap: 1vmin; }
  .task-form-actions button {
    font: inherit; font-size: max(15px, 1.9vmin); padding: max(9px, 0.8vmin) max(14px, 2vmin);
    min-height: 40px;
    border-radius: 0.7vmin; cursor: pointer; border: 0.15vmin solid var(--border);
    background: var(--panel-2); color: var(--fg);
  }
  .task-form-actions button:disabled { opacity: 0.5; cursor: default; }
  .task-form-actions .task-confirm { background: var(--accent); color: #061021; border-color: var(--accent); font-weight: 600; }
  .task-form-msg { font-size: 1.9vmin; min-height: 2.2vmin; }
  .task-form-msg.err { color: #ff8b8b; }
  /* Floating add control, bottom right, the way a phone calendar does it. One
     control for the whole app, and deliberately nothing but the icon: a text
     label here sizes the control, and any difference in label length between
     views (task vs event) would shift the button under the user's finger. So it
     carries a fixed size, is anchored directly rather than through a wrapper,
     and gets its wording from aria-label/title instead of from visible text.
     Sized off vmin with a px floor so it stays a sane target on a wall display
     and on a phone. */
  .fab {
    position: fixed; right: 2.4vmin; bottom: 2.4vmin; z-index: 20;
    width: 7.6vmin; height: 7.6vmin; min-width: 52px; min-height: 52px;
    flex: none; box-sizing: border-box;
    border-radius: 50%; border: none; cursor: pointer; padding: 0;
    background: var(--accent); color: #061021;
    font-size: 4.6vmin; line-height: 1; font-weight: 400;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0.3vmin 1.2vmin rgba(0, 0, 0, 0.45);
  }
  .fab:hover { filter: brightness(1.1); }
  .fab:active { transform: scale(0.94); }
  .fab:focus-visible { outline: 0.3vmin solid var(--fg); outline-offset: 0.3vmin; }
  /* main is a flex row holding a scrolling child, so bottom padding here keeps
     the last row from parking permanently underneath the floating button. */
  main { padding-bottom: 11vmin; }

  /* The add menu, docked directly above the + button. The bottom offset is the
     FAB's own bottom plus its own resolved height plus one gap, so the gap
     between panel and button is identical whether the FAB ended up at its 52px
     floor (a phone) or its vmin size (a wall panel). Same discipline as the
     button itself: computed from the FAB's real size, never from a guess that
     can drift out of sync with it. */
  .add-menu {
    position: fixed; z-index: 21;
    right: 2.4vmin;
    bottom: calc(2.4vmin + max(52px, 7.6vmin) + max(10px, 1.1vmin));
    min-width: clamp(180px, 21vmin, 320px);
    max-width: min(86vw, 360px);
    display: flex; flex-direction: column; gap: 0.3vmin;
    padding: max(6px, 0.6vmin); border-radius: max(12px, 1.4vmin);
    /* Translucent rather than opaque: the calendar is visible through it, which
       is what makes it read as a panel over the wall instead of a dialog. The
       blur and the border are what keep the labels legible over a busy week. */
    background: rgba(10, 13, 19, 0.62);
    border: 0.1vmin solid rgba(232, 236, 243, 0.16);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    backdrop-filter: blur(14px) saturate(1.3);
    box-shadow: 0 0.6vmin 2vmin rgba(0, 0, 0, 0.5);
  }
  /* The panel must actually disappear when collapsed. The global [hidden] guard
     further up this stylesheet is specificity (0,1,0), the same as .add-menu
     above, so the later `display: flex` was silently winning and the border and
     background stayed on screen after the menu closed. Qualifying with the
     attribute makes this (0,2,0) and immune to source order, which is the only
     kind of rule that stays correct when someone appends CSS to the end later.
     Same reason .nav is unaffected: its display rule happens to sit above the
     guard. Do not remove this. */
  .add-menu[hidden] { display: none; }
  .menu-item {
    display: flex; align-items: center; gap: 1.1vmin; width: 100%;
    min-height: max(46px, 5.4vmin); padding: max(8px, 0.9vmin) max(10px, 1.1vmin);
    border-radius: max(8px, 0.9vmin); cursor: pointer; text-align: left;
    border: none; background: transparent; color: var(--fg); font: inherit;
  }
  .menu-item:hover:not(:disabled), .menu-item:focus-visible {
    background: rgba(232, 236, 243, 0.1); outline: none;
  }
  .menu-item:disabled { opacity: 0.45; cursor: default; }
  .mi-glyph {
    display: flex; align-items: center; justify-content: center; flex: none;
    width: max(30px, 3.6vmin); height: max(30px, 3.6vmin); border-radius: 50%;
    background: var(--accent); color: #061021; font-size: max(16px, 2vmin);
  }
  .menu-item:disabled .mi-glyph { background: var(--muted); }
  .mi-text { display: flex; flex-direction: column; gap: 0.2vmin; min-width: 0; }
  .mi-label { font-size: max(16px, 2.1vmin); }
  .mi-why { font-size: max(12px, 1.5vmin); color: var(--muted); }
  .task-form input[type="text"],
  .task-form input[type="date"],
  .task-form input[type="time"] {
    /* Same 16px floor as the textarea: iOS zooms on focus for any of these. */
    font: inherit; font-size: max(16px, 2.3vmin); padding: max(8px, 1vmin) 1.2vmin;
    min-height: max(40px, 3.4vmin);
    border-radius: 0.8vmin; border: 0.15vmin solid var(--border);
    background: var(--panel-2); color: var(--fg); outline: none; width: 100%;
  }
  .task-form input:focus { border-color: var(--accent); }
  .field-row { display: flex; gap: 1.2vmin; }
  .field-row > * { flex: 1; min-width: 0; }
  .field-col { display: flex; flex-direction: column; gap: 0.6vmin; }
  .check-row {
    display: flex; align-items: center; gap: 0.9vmin;
    font-size: max(14px, 2.1vmin); color: var(--fg); cursor: pointer;
    min-height: 36px;
  }
  .check-row input { width: 2.2vmin; height: 2.2vmin; accent-color: var(--accent); flex-shrink: 0; }
  .task-check {
    width: 2.2vmin; height: 2.2vmin; border-radius: 0.5vmin;
    border: 0.25vmin solid var(--muted); display: inline-block;
    accent-color: var(--accent); cursor: pointer;
  }
</style>
</head>
<body>
  <header>
    <div id="clock">--:--</div>
    <div id="date"></div>
    <div id="sync"></div>
  </header>

  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <div class="nav">
      <button id="prev" title="Previous">&lsaquo;</button>
      <div class="range-label" id="range"></div>
      <button id="next" title="Next">&rsaquo;</button>
      <button class="today" id="today">Today</button>
    </div>
  </div>

  <div class="filters" id="filters"></div>

  <main id="main"></main>

  <!-- Floating add control, bottom right, the way a phone calendar does it. One
       control for the whole app and nothing but the icon: an earlier version put
       a text label beside it, but the wrapper was right-anchored and sized by its
       contents, so a longer word ("Create event" vs "Create task") shifted the
       button sideways. The button is now a direct fixed-position child of the
       page with an explicit size, so nothing about the current view can move it. -->
  <button class="fab" id="add-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="add-menu" aria-label="Add an event or task">+</button>

  <!-- The add menu: a translucent panel sitting directly above the + button, not
       a modal. It never dims the wall and it never covers the calendar, because
       the whole point is that the board stays readable while you pick. It is
       populated from ADD_ACTIONS in JS, so a new kind of thing to add is one
       entry there and nothing else changes. Dismissal is Escape or a click
       anywhere outside, since there is no backdrop to click. -->
  <div class="add-menu" id="add-menu" role="menu" aria-label="What to add" hidden></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-card" id="modal-card"></div>
  </div>

<script>
/* =========================================================================
   State + helpers
   ========================================================================= */
const POLL_MS = 60000;
const state = { data: null, view: "agenda", cursor: null, hidden: new Set() };

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function tz() { return (state.data && state.data.timezone) || "America/New_York"; }

function toKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function fromKey(k) {
  return new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10), 12, 0, 0);
}
function addDaysKey(k, n) { const d = fromKey(k); d.setDate(d.getDate() + n); return toKey(d); }
function addMonthsKey(k, n) { const d = fromKey(k); d.setMonth(d.getMonth() + n); return toKey(d); }
function todayKey() {
  const p = new Intl.DateTimeFormat("en-CA", {
    timeZone: tz(), year: "numeric", month: "2-digit", day: "2-digit",
  }).formatToParts(new Date());
  const m = {}; p.forEach(x => m[x.type] = x.value);
  return `${m.year}-${m.month}-${m.day}`;
}

function fmtLong(k) { return fromKey(k).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }); }
function fmtMed(k) { return fromKey(k).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }); }
function dayLabel(k) {
  const t = todayKey();
  if (k === t) return "Today";
  if (k === addDaysKey(t, -1)) return "Yesterday";
  if (k === addDaysKey(t, 1)) return "Tomorrow";
  return fmtLong(k);
}
function fmtMonthYear(k) { return fromKey(k).toLocaleDateString("en-US", { month: "long", year: "numeric" }); }
function startOfWeekKey(k) {
  const d = fromKey(k); d.setDate(d.getDate() - d.getDay()); return toKey(d);
}

function fmtTime(local) {
  if (!local || local.length === 10) return "all day";
  const hh = +local.slice(11, 13), mm = local.slice(14, 16);
  return `${hh % 12 || 12}:${mm} ${hh >= 12 ? "PM" : "AM"}`;
}
function startMinutes(ev) {
  if (ev.start.all_day) return 0;
  return +ev.start.local.slice(11, 13) * 60 + +ev.start.local.slice(14, 16);
}
function endMinutes(ev) {
  if (!ev.end || !ev.end.local || ev.start.all_day) return null;
  const sk = ev.start.local.slice(0, 10), ek = ev.end.local.slice(0, 10);
  if (ek !== sk) return 1440;
  return +ev.end.local.slice(11, 13) * 60 + +ev.end.local.slice(14, 16);
}
function durationMinutes(ev) {
  if (ev.start.all_day) return null;
  const s = startMinutes(ev), e = endMinutes(ev);
  if (e == null) return null;
  return Math.max(0, e - s);
}
function evRange(ev) {
  const sk = ev.start.local.slice(0, 10);
  let ek = (ev.end && ev.end.local) ? ev.end.local.slice(0, 10) : sk;
  if (ev.start.all_day) {
    ek = addDaysKey(ek, -1);
    if (ek < sk) ek = sk;
  } else if (ek !== sk && ev.end.local.slice(11, 16) === "00:00") {
    ek = addDaysKey(ek, -1);
  }
  return [sk, ek];
}
function durationText(ev) {
  if (ev.start.all_day) {
    const [sk, ek] = evRange(ev);
    const days = Math.round((fromKey(ek) - fromKey(sk)) / 86400000) + 1;
    return days > 1 ? `${days} days` : "all day";
  }
  const m = durationMinutes(ev);
  if (m == null) return "";
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h ${r}m` : `${h}h`;
}

function indexByDay() {
  const map = {};
  for (const ev of (state.data.events || [])) {
    if (state.hidden.has(ev.calendar_id)) continue;
    const [sk, ek] = evRange(ev);
    let k = sk;
    let guard = 0;
    while (k <= ek && guard++ < 400) {
      (map[k] = map[k] || []).push(ev);
      k = addDaysKey(k, 1);
    }
  }
  return map;
}
function eventsOnDay(map, k) { return (map[k] || []).slice().sort((a, b) => a.start.local.localeCompare(b.start.local)); }
function findEvent(id) { return (state.data.events || []).find(e => e.id === id); }

/* =========================================================================
   Render: Agenda
   ========================================================================= */
function stripHtml(events) {
  const timed = events.filter(e => !e.start.all_day);
  const blocks = timed.map(e => {
    const s = startMinutes(e);
    const eMin = endMinutes(e) ?? s + 30;
    const left = s / 1440 * 100;
    const w = Math.max(0.9, Math.min(100 - left, (eMin - s) / 1440 * 100));
    return `<div class="strip-block" data-id="${esc(e.id)}" title="${esc(e.summary)} · ${durationText(e)}"
              style="left:${left}%;width:${w}%;background:${e.color}"></div>`;
  }).join("");
  const ticks = [0, 6, 12, 18, 24].map(h =>
    `<div class="strip-tick" style="left:${h / 24 * 100}%"></div>
     <div class="strip-label" style="left:${h / 24 * 100}%">${h === 0 ? "12a" : h === 12 ? "12p" : h > 12 ? (h - 12) + "p" : h + "a"}</div>`
  ).join("");
  return `<div class="day-strip">${ticks}${blocks}</div>`;
}

function agendaRows(events) {
  const maxDur = Math.max(30, ...events.map(e => durationMinutes(e) || 0));
  return events.map(e => {
    const dur = durationText(e);
    const m = durationMinutes(e);
    const bar = m ? `<div class="dur-bar"><i style="width:${Math.max(4, m / maxDur * 100)}%"></i></div>` : "";
    const loc = e.location ? `<span class="sub"> · ${esc(e.location)}</span>` : "";
    return `
      <div class="event ${e.start.all_day ? "all-day" : ""}" data-id="${esc(e.id)}"
           style="--cal-color:${e.color}" tabindex="0">
        <div class="time">${fmtTime(e.start.local)}</div>
        <div class="title">${esc(e.summary)}${loc}</div>
        <div class="dur">${dur}</div>
        ${bar}
        <div class="cal">${esc(e.calendar)}</div>
      </div>`;
  }).join("");
}

function renderAgenda() {
  // Agenda shows a single day (today by default) and the arrows step by day.
  // Week and month are for wider ranges; past days are available via the arrows.
  const map = indexByDay();
  const k = state.cursor;
  const isToday = k === todayKey();
  const list = eventsOnDay(map, k);

  document.getElementById("range").textContent = isToday ? fmtLong(k) : dayLabel(k);
  const main = document.getElementById("main");
  if (!list.length) {
    main.innerHTML = `<div class="empty"><div class="big">Nothing scheduled</div>${esc(dayLabel(k))}</div>`;
    return;
  }
  main.innerHTML = `<div class="agenda"><div class="agenda-day">
    <div class="day-head ${isToday ? "today" : ""}">${esc(dayLabel(k))}<span class="count">· ${list.length} event${list.length > 1 ? "s" : ""}</span></div>
    ${stripHtml(list)}
    ${agendaRows(list)}
  </div></div>`;
}

/* =========================================================================
   Render: Week
   ========================================================================= */
function renderWeek() {
  const start = startOfWeekKey(state.cursor);
  const days = [...Array(7)].map((_, i) => addDaysKey(start, i));
  const today = todayKey();
  const map = indexByDay();

  // visible hour range from this week's timed events
  let minM = 24 * 60, maxM = 0, any = false;
  for (const k of days) for (const e of (map[k] || [])) {
    if (e.start.all_day) continue;
    const s = startMinutes(e), en = endMinutes(e) ?? s + 30;
    const sClamp = Math.min(s, 1440), eClamp = Math.min(en, 1440);
    if (sClamp >= 1440 && s > 1440) continue;
    minM = Math.min(minM, sClamp); maxM = Math.max(maxM, eClamp); any = true;
  }
  let minH = any ? Math.floor(minM / 60) : 8;
  let maxH = any ? Math.ceil(maxM / 60) : 20;
  minH = Math.max(0, minH - (minH > 0 ? 1 : 0));
  maxH = Math.min(24, maxH + (maxH < 24 ? 1 : 0));
  if (maxH - minH < 6) maxH = Math.min(24, minH + 6);
  const span = (maxH - minH) * 60;

  document.getElementById("range").textContent =
    `${fmtMed(days[0])} – ${fmtMed(days[6])}`;

  const head = `<div class="wk-head"><div></div>` + days.map(k => {
    const d = fromKey(k);
    return `<div class="wk-day-head ${k === today ? "today" : ""}">
      ${d.toLocaleDateString("en-US", { weekday: "short" })}<span class="num">${d.getDate()}</span></div>`;
  }).join("") + `</div>`;

  const allday = `<div class="wk-allday"><div></div>` + days.map(k => {
    const list = (map[k] || []).filter(e => e.start.all_day);
    return `<div class="wk-allday-cell">` + list.map(e =>
      `<div class="wk-allday-chip" data-id="${esc(e.id)}" style="background:${e.color}">${esc(e.summary)}</div>`
    ).join("") + `</div>`;
  }).join("") + `</div>`;

  const gutter = `<div class="wk-gutter">` + Array.from({ length: maxH - minH + 1 }, (_, i) => {
    const h = minH + i, top = (i * 60) / span * 100;
    const lbl = h === 0 ? "12a" : h === 12 ? "12p" : h > 12 ? (h - 12) + "p" : h + "a";
    return `<div class="wk-hour-label" style="top:${top}%">${lbl}</div>`;
  }).join("") + `</div>`;

  const cols = days.map(k => {
    const list = (map[k] || []).filter(e => !e.start.all_day);
    const lines = Array.from({ length: maxH - minH }, (_, i) =>
      `<div class="wk-gridline" style="top:${(i * 60) / span * 100}%"></div>`).join("");
    const blocks = list.map(e => {
      const s = Math.max(0, Math.min(1440, startMinutes(e)));
      const en = Math.max(s, Math.min(1440, endMinutes(e) ?? s + 30));
      const top = (s - minH * 60) / span * 100;
      const h = Math.max(3.2, (en - s) / span * 100);
      return `<div class="wk-block" data-id="${esc(e.id)}"
                style="top:${top}%;height:${h}%;background:${e.color}22;border-left-color:${e.color}">
        <div class="t" style="color:${e.color}">${esc(e.summary)}</div>
        <div class="s">${fmtTime(e.start.local)} · ${durationText(e)}</div>
      </div>`;
    }).join("");
    return `<div class="wk-col">${lines}${blocks}</div>`;
  }).join("");

  const body = `<div class="wk-body">${gutter}${cols}</div>`;
  document.getElementById("main").innerHTML =
    `<div class="week">${head}${allday}${body}</div>`;
}

/* =========================================================================
   Render: Month
   ========================================================================= */
function renderMonth() {
  const first = fromKey(state.cursor.slice(0, 8) + "01");
  const gridStart = startOfWeekKey(toKey(first));
  const cells = [...Array(42)].map((_, i) => addDaysKey(gridStart, i));
  const today = todayKey();
  const map = indexByDay();

  document.getElementById("range").textContent = fmtMonthYear(state.cursor);

  const dow = `<div class="mo-dow">` +
    ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => `<span>${d}</span>`).join("") +
    `</div>`;

  const body = `<div class="mo-grid">` + cells.map((k, i) => {
    const d = fromKey(k);
    const out = d.getMonth() !== first.getMonth();
    const list = eventsOnDay(map, k);
    const shown = list.slice(0, 3);
    const chips = shown.map(e => {
      const isDay = e.start.all_day;
      const label = isDay ? "" : `<span class="ct">${fmtTime(e.start.local)}</span>`;
      return `<div class="mo-chip" data-id="${esc(e.id)}" style="--c:${e.color}"
                title="${esc(e.summary)} · ${durationText(e)}">${label}${esc(e.summary)}</div>`;
    }).join("");
    const more = list.length > shown.length
      ? `<div class="mo-more" data-day="${k}">+${list.length - shown.length} more</div>` : "";
    return `<div class="mo-cell ${out ? "out" : ""} ${k === today ? "today" : ""}" data-day="${k}">
      <div class="mo-date">${d.getDate()}</div>${chips}${more}</div>`;
  }).join("") + `</div>`;

  document.getElementById("main").innerHTML = `<div class="month">${dow}${body}</div>`;
}

/* =========================================================================
   Modal
   ========================================================================= */
function detailRow(label, value) {
  if (!value) return "";
  return `<div class="row"><dt>${label}</dt><dd>${value}</dd></div>`;
}
function openEvent(ev) {
  if (!ev) return;
  const when = ev.start.all_day
    ? `${fmtLong(ev.start.local.slice(0, 10))} · ${durationText(ev)}`
    : `${fmtLong(ev.start.local.slice(0, 10))} · ${fmtTime(ev.start.local)} – ${fmtTime(ev.end && ev.end.local)} (${durationText(ev)})`;
  const att = (ev.attendees || []);
  const attStr = att.length ? att.map(a =>
    esc(a.name) + (a.status && a.status !== "accepted" ? ` (${esc(a.status)})` : "")).join(", ") : "";
  const cals = (state.data && state.data.calendar_list) || [];
  const canWrite = !!(state.data && state.data.can_write);
  let moveHtml = "";
  if (cals.length > 1) {
    if (canWrite) {
      moveHtml = `
        <div class="move">
          <label class="ro" for="move-cal">Move to calendar</label>
          <select id="move-cal">
            ${cals.map(c => `<option value="${esc(c.id)}" ${c.id === ev.calendar_id ? "selected" : ""}${c.writable === false ? " disabled" : ""}>${esc(c.summary)}${c.writable === false ? " (no access)" : ""}</option>`).join("")}
          </select>
          <div class="move-msg" id="move-msg"></div>
        </div>`;
    } else {
      moveHtml = `<div class="move-msg ro">Moving events is disabled — the calendar token is read-only.</div>`;
    }
  }

  document.getElementById("modal-card").innerHTML = `
    <div class="modal-accent" style="background:${ev.color}"></div>
    <button class="modal-x" id="modal-x">&times;</button>
    <h2>${esc(ev.summary)}</h2>
    <div class="modal-cal"><span style="color:${ev.color}">●</span> ${esc(ev.calendar)}</div>
    <dl>
      ${detailRow("When", esc(when))}
      ${detailRow("Where", esc(ev.location))}
      ${detailRow("Duration", esc(durationText(ev)))}
      ${detailRow("Attendees", attStr)}
      ${detailRow("Notes", esc(ev.description))}
    </dl>
    ${moveHtml}
    ${ev.link ? `<a class="gcal" href="${esc(ev.link)}" target="_blank" rel="noopener">Open in Google Calendar &rarr;</a>` : ""}
  `;
  const modal = document.getElementById("modal");
  modal.hidden = false;
  document.getElementById("modal-x").onclick = closeModal;
  document.getElementById("modal-backdrop").onclick = closeModal;
  const sel = document.getElementById("move-cal");
  if (sel) sel.onchange = () => moveEvent(ev, sel.value);
}

async function moveEvent(ev, toCal) {
  const sel = document.getElementById("move-cal");
  const msg = document.getElementById("move-msg");
  if (sel) sel.disabled = true;
  if (msg) { msg.className = "move-msg"; msg.textContent = "Moving…"; }
  try {
    const res = await fetch("/api/events/move", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ event_id: ev.id, from_calendar: ev.calendar_id, to_calendar: toCal }),
    });
    if (!res.ok) {
      let d = res.statusText;
      try { d = (await res.json()).detail || d; } catch (e) {}
      throw new Error(d);
    }
    if (msg) { msg.className = "move-msg ok"; msg.textContent = "Moved."; }
    await poll();
    closeModal();
  } catch (e) {
    if (msg) { msg.className = "move-msg err"; msg.textContent = "✕ " + e.message; }
    if (sel) sel.disabled = false;
  }
}
function closeModal() { document.getElementById("modal").hidden = true; }

/* =========================================================================
   Tasks panel
   Reads state.data.tasks, produced server-side from the Google Tasks API.
   ========================================================================= */
function taskDueLabel(due) {
  // Tasks carry date-only due values, so compare in wall-local day terms and
  // label relative to the wall's today rather than the browser's.
  const today = todayKey();
  if (due === today) return "Today";
  if (due === addDaysKey(today, 1)) return "Tomorrow";
  if (due === addDaysKey(today, -1)) return "Yesterday";
  const d = fromKey(due);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

function tasksEmptyState(msg) {
  return `<div class="tasks-wrap">
    <div class="tasks-head"><div class="tasks-title">Tasks</div></div>
    <div class="tasks-note">${esc(msg)}</div>
  </div>`;
}

function tasksHead() {
  return `<div class="tasks-head"><div class="tasks-title">Tasks</div>
    <div class="tasks-count" id="tasks-count"></div>
  </div>`;
}

function taskRowHtml(t) {
  let cls = "task-row";
  let due = "";
  if (t.due) {
    due = `<div class="task-due">${esc(taskDueLabel(t.due))}</div>`;
    if (t.due < todayKey()) cls += " overdue";
    else if (t.due === todayKey()) cls += " due-today";
  } else {
    due = `<div class="task-due">no due date</div>`;
  }
  const sub = t.has_subtasks ? `<div class="task-sub">has subtasks</div>` : "";
  const note = t.notes ? `<div class="task-sub">${esc(t.notes)}</div>` : "";
  return `<div class="${cls}" data-task-id="${esc(t.id)}">
    <div><input type="checkbox" class="task-check" /></div>
    <div><div class="task-title">${esc(t.title)}</div>${sub}${note}</div>
    ${due}
  </div>`;
}

function renderTasks() {
  const d = state.data || {};
  const status = d.tasks_status;

  // All task panel behavior (including status checks and errors) lives in this
  // function so the harness can test it against both the fixture and the live
  // API. The UI never renders a Tasks tab unless the panel is connected.

  if (status === "unavailable") {
    document.getElementById("main").innerHTML = tasksEmptyState(
      "Tasks panel is not connected yet. Re-authorize the wallboard token with the " +
      "Google Tasks scope to enable it.");
    return;
  }
  if (status === "missing") {
    document.getElementById("main").innerHTML = tasksEmptyState(
      `No Google Tasks list named "${d.tasks_list || "Wallboard"}" yet. ` +
      "Create it in Google Tasks and it will appear here within a minute.");
    return;
  }
  if (status === "error") {
    document.getElementById("main").innerHTML = tasksEmptyState(
      `Could not read tasks: ${d.tasks_error || "unknown error"}`);
    return;
  }
  if (status === "never") {
    document.getElementById("main").innerHTML = tasksEmptyState("Syncing tasks…");
    return;
  }

  // At this point the panel is connected and has a task list, but tasks may be
  // empty. Always render the head (title, count, add input) so tests can assert
  // on its presence and the count is accurate.
  const tasks = d.tasks || [];
  const listName = d.tasks_list || "Wallboard";

  const rows = tasks.map(t => taskRowHtml(t)).join("");
  document.getElementById("main").innerHTML =
    tasksHead() + `<div class="tasks-wrap">${rows}</div>`;

  // Populate the open task count
  const countEl = document.getElementById("tasks-count");
  if (countEl) countEl.textContent = `${tasks.length} open`;

// Wire up the add input and all task checkboxes.
  _wireAdd();
  _wireChecks();
}

function _wireAdd() {
  /* Intentionally empty. The add control lives in the toolbar, not in any one
     view, so there is nothing per-view to re-wire after a render. */
}

/* Create-task dialog. Shares #modal with the event detail card, so Escape and
   the backdrop already work; the contents and the handlers are replaced. */
function openTaskCreate() {
  document.getElementById("modal-card").innerHTML = `
    <button class="modal-x" id="modal-x">&times;</button>
    <h2>New task</h2>
    <div class="task-form">
      <label class="ro" for="task-new-title">What needs doing?</label>
      <textarea id="task-new-title" maxlength="300" rows="3"
        placeholder="e.g. Pick up the dry cleaning"></textarea>
      <div class="task-form-msg" id="task-form-msg"></div>
      <div class="task-form-actions">
        <button id="task-cancel" type="button">Cancel</button>
        <button class="task-confirm" id="task-confirm" type="button">Create task</button>
      </div>
    </div>`;

  const modal = document.getElementById("modal");
  modal.hidden = false;

  const input = document.getElementById("task-new-title");
  const msg = document.getElementById("task-form-msg");
  const confirm = document.getElementById("task-confirm");
  input.focus();

  const close = () => closeModal();
  document.getElementById("modal-x").onclick = close;
  document.getElementById("modal-backdrop").onclick = close;
  document.getElementById("task-cancel").onclick = close;

  const submit = async () => {
    const title = input.value.trim();
    if (!title) {
      msg.className = "task-form-msg err";
      msg.textContent = "Give the task a title first.";
      input.focus();
      return;
    }
    confirm.disabled = true;
    msg.className = "task-form-msg";
    msg.textContent = "Creating…";
    try {
      const res = await fetch("/api/tasks", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({title}),
      });
      if (!res.ok) {
        let d = String(res.status);
        try { d = (await res.json()).detail || d; } catch (e) {}
        throw new Error(d);
      }
      closeModal();
      await poll();
    } catch (e) {
      // Stay in the dialog with the text intact. Replacing the page here would
      // throw away the list and the half-typed title, which is what the inline
      // input used to do.
      confirm.disabled = false;
      msg.className = "task-form-msg err";
      msg.textContent = "✕ " + e.message;
      input.focus();
    }
  };

  confirm.onclick = submit;
  // Enter submits; Shift+Enter is a newline. The wall gets typed at.
  input.onkeydown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  };
}

/* Create-event dialog, the calendar-side twin of openTaskCreate. Shares #modal,
   so Escape and the backdrop already work. Unlike a task, an event lands on a
   real shared calendar that the rest of the household reads, so the calendar and
   the times are explicit rather than inferred. */
function writableCalendars() {
  const cals = (state.data && state.data.calendar_list) || [];
  return cals.filter((c) => c.writable);
}

/* Default a new event to the next half hour on the day being looked at, which
   for Agenda/Week/Month is whatever date the view is parked on. */
function _defaultStartTime() {
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  const next = Math.ceil(mins / 30) * 30;
  const h = Math.floor(next / 60), m = next % 60;
  return [String(h).padStart(2, "0"), String(m).padStart(2, "0")];
}

function openEventCreate() {
  const cals = writableCalendars();
  const canWrite = !!(state.data && state.data.can_write);

  if (!canWrite || !cals.length) {
    document.getElementById("modal-card").innerHTML = `
      <button class="modal-x" id="modal-x">&times;</button>
      <h2>New event</h2>
      <p class="tasks-note">${canWrite
        ? "None of the displayed calendars are writable from the wallboard."
        : "Calendar write access is not granted to the wallboard token."}</p>`;
    document.getElementById("modal").hidden = false;
    document.getElementById("modal-x").onclick = () => closeModal();
    document.getElementById("modal-backdrop").onclick = () => closeModal();
    return;
  }

  const [sh, sm] = _defaultStartTime();
  const endMins = (parseInt(sh, 10) * 60 + parseInt(sm, 10) + 60);
  const eh = String(Math.floor(endMins / 60) % 24).padStart(2, "0");
  const em = String(endMins % 60).padStart(2, "0");

  document.getElementById("modal-card").innerHTML = `
    <button class="modal-x" id="modal-x">&times;</button>
    <h2>New event</h2>
    <div class="task-form">
      <label class="ro" for="ev-title">Title</label>
      <input type="text" id="ev-title" maxlength="300" placeholder="e.g. Dentist">
      <div class="field-row">
        <div class="field-col">
          <label class="ro" for="ev-date">Date</label>
          <input type="date" id="ev-date" value="${state.cursor}">
        </div>
        <div class="field-col">
          <label class="ro" for="ev-cal">Calendar</label>
          <select id="ev-cal">${cals.map((c) =>
            `<option value="${esc(c.id)}">${esc(c.summary)}</option>`).join("")}</select>
        </div>
      </div>
      <label class="check-row"><input type="checkbox" id="ev-allday"> All day</label>
      <div class="field-row" id="ev-time-row">
        <div class="field-col">
          <label class="ro" for="ev-start">Starts</label>
          <input type="time" id="ev-start" value="${sh}:${sm}">
        </div>
        <div class="field-col">
          <label class="ro" for="ev-end">Ends</label>
          <input type="time" id="ev-end" value="${eh}:${em}">
        </div>
      </div>
      <label class="ro" for="ev-desc">Notes <span class="field-hint">(optional)</span></label>
      <textarea id="ev-desc" maxlength="1000" rows="2" placeholder="Anything to remember"></textarea>
      <div class="task-form-msg" id="ev-msg"></div>
      <div class="task-form-actions">
        <button id="ev-cancel" type="button">Cancel</button>
        <button class="task-confirm" id="ev-confirm" type="button">Create event</button>
      </div>
    </div>`;

  const modal = document.getElementById("modal");
  modal.hidden = false;

  const title = document.getElementById("ev-title");
  const date = document.getElementById("ev-date");
  const allday = document.getElementById("ev-allday");
  const start = document.getElementById("ev-start");
  const end = document.getElementById("ev-end");
  const timeRow = document.getElementById("ev-time-row");
  const msg = document.getElementById("ev-msg");
  const confirm = document.getElementById("ev-confirm");
  title.focus();

  // All-day events have no times, so hide the row rather than showing inputs
  // that would be ignored by the API.
  const syncAllday = () => { timeRow.hidden = allday.checked; };
  allday.onchange = syncAllday;
  syncAllday();

  const close = () => closeModal();
  document.getElementById("modal-x").onclick = close;
  document.getElementById("modal-backdrop").onclick = close;
  document.getElementById("ev-cancel").onclick = close;

  const submit = async () => {
    const t = title.value.trim();
    if (!t) {
      msg.className = "task-form-msg err";
      msg.textContent = "Give the event a title first.";
      title.focus();
      return;
    }
    if (!date.value) {
      msg.className = "task-form-msg err";
      msg.textContent = "Pick a date.";
      date.focus();
      return;
    }
    if (!allday.checked && start.value && end.value && end.value <= start.value) {
      msg.className = "task-form-msg err";
      msg.textContent = "The end time has to be after the start.";
      end.focus();
      return;
    }
    const body = {
      title: t,
      date: date.value,
      all_day: allday.checked,
      calendar_id: document.getElementById("ev-cal").value,
    };
    if (!allday.checked) {
      body.start_time = start.value;
      body.end_time = end.value;
    }
    const desc = document.getElementById("ev-desc").value.trim();
    if (desc) body.description = desc;

    confirm.disabled = true;
    msg.className = "task-form-msg";
    msg.textContent = "Creating…";
    try {
      const res = await fetch("/api/events", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        let d = String(res.status);
        try { d = (await res.json()).detail || d; } catch (e) {}
        throw new Error(d);
      }
      closeModal();
      await poll();
    } catch (e) {
      confirm.disabled = false;
      msg.className = "task-form-msg err";
      msg.textContent = "✕ " + e.message;
    }
  };

  confirm.onclick = submit;
  // Enter from a single-line field submits; in the notes box it is a newline.
  const enterSubmits = (el) => {
    el.onkeydown = (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
    };
  };
  enterSubmits(title);
  enterSubmits(start);
  enterSubmits(end);
}

function _wireChecks() {
  document.querySelectorAll(".task-check").forEach((cb) => {
    cb.onclick = async (e) => {
      e.stopPropagation();
      const row = cb.closest(".task-row");
      const id = row?.dataset.taskId;
      if (!id) return;
      cb.disabled = true;
      try {
        const res = await fetch(`/api/tasks/${encodeURIComponent(id)}/complete`,
          {method: "POST"});
        if (!res.ok) throw new Error(`${res.status}`);
        await poll();
      } catch (e) {
        cb.disabled = false;
        row.classList.add("overdue");
      }
    };
  });
}

/* =========================================================================
   Nav + wiring
   ========================================================================= */
/* =========================================================================
   View registry
   ------------------------------------------------------------------------
   Every tab is one entry here, and the tab strip is generated from it. Adding a
   tab is a single object: give it a label, say which chrome it wants, say what
   its add button does (or null for none), say how the arrows step its cursor,
   and hand it a render function.

   chrome:
     "calendar" - shows the filter chips and the date stepper
     "tasks"    - a list, so the filter chips and stepper are meaningless there
     "none"     - neither, for a view with no calendar range at all (home
                  control is the intended first one of these)

   A Home tab is meant to land here later, for example:
     home: { label: "Home", chrome: "none", add: null,
             step: () => {}, render: renderHome }
   It would want its own state and its own poll interval rather than reading
   off state.data, so the shape deliberately does not assume a calendar.
   ========================================================================= */
const VIEWS = {
  agenda: {
    label: "Agenda", chrome: "calendar", fab: true,
    step: (dir) => { state.cursor = addDaysKey(state.cursor, dir); },
    render: renderAgenda,
  },
  week: {
    label: "Week", chrome: "calendar", fab: true,
    step: (dir) => { state.cursor = addDaysKey(state.cursor, dir * 7); },
    render: renderWeek,
  },
  month: {
    label: "Month", chrome: "calendar", fab: true,
    step: (dir) => { state.cursor = addMonthsKey(state.cursor, dir); },
    render: renderMonth,
  },
  tasks: {
    label: "Tasks", chrome: "tasks", fab: true,
    step: () => {},
    render: renderTasks,
  },
};

function buildTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = Object.entries(VIEWS).map(([id, v]) =>
    `<button class="tab" data-view="${esc(id)}">${esc(v.label)}</button>`).join("");
  el.querySelectorAll(".tab").forEach((t) => {
    t.onclick = () => { state.view = t.dataset.view; render(); };
  });
}

function currentView() {
  // An unknown view falls back rather than rendering nothing: a stale saved
  // state.view must never leave the wall blank.
  return VIEWS[state.view] || VIEWS.agenda;
}

/* What the floating + offers, and it is deliberately NOT tied to the current
   view. Guessing "you are on Tasks so you must mean a task" is wrong the moment
   a second tab exists: the same thought ("put that on the calendar") arrives from
   every view, and a future Home tab has no calendar context to guess from at
   all. So the button always offers the same short list and the user picks.
   `blocked` returns why an action cannot run, so the entry stays visible and
   honest instead of silently vanishing. */
const ADD_ACTIONS = [
  {
    id: "event", label: "New event", glyph: "\u25A7", run: openEventCreate,
    blocked: () => {
      if (!state.data || !state.data.can_write) return "Calendar is read-only";
      if (!writableCalendars().length) return "No writable calendar";
      return "";
    },
  },
  {
    id: "task", label: "New task", glyph: "\u2713", run: openTaskCreate,
    blocked: () => {
      if (state.data && state.data.tasks_status === "unavailable") return "Tasks are not syncing";
      return "";
    },
  },
];

/* The add menu. Deliberately not a modal: no backdrop, no dimming, no centering,
   and the calendar stays fully readable behind it. It is positioned purely in CSS
   relative to the + button, so it cannot drift away from the button the way the
   old caption made the button drift. Dismissal is Escape or a click outside,
   which stand in for the backdrop a modal would have had. */
function openAddChooser() {
  const menu = document.getElementById("add-menu");
  menu.innerHTML = ADD_ACTIONS.map((a) => {
    const why = a.blocked();
    return `<button type="button" role="menuitem" class="menu-item" id="add-${a.id}"${why ? " disabled" : ""}>
      <span class="mi-glyph" aria-hidden="true">${a.glyph}</span>
      <span class="mi-text">
        <span class="mi-label">${esc(a.label)}</span>
        ${why ? `<span class="mi-why">${esc(why)}</span>` : ""}
      </span>
    </button>`;
  }).join("");
  menu.hidden = false;
  document.getElementById("add-btn").setAttribute("aria-expanded", "true");
  for (const a of ADD_ACTIONS) {
    const el = document.getElementById("add-" + a.id);
    if (el && !el.disabled) el.onclick = () => { closeAddChooser(); a.run(); };
  }
  const first = menu.querySelector(".menu-item:not(:disabled)") || menu.querySelector(".menu-item");
  if (first) first.focus();
}

function closeAddChooser() {
  const menu = document.getElementById("add-menu");
  if (menu.hidden) return;
  menu.hidden = true;
  menu.innerHTML = "";
  document.getElementById("add-btn").setAttribute("aria-expanded", "false");
}

/* The one add control. Its geometry is fixed by the stylesheet and its only
   text is the "+" glyph, so no view can move or resize it. The registry decides
   only whether the control is shown at all. */
function syncAddButton(view) {
  const btn = document.getElementById("add-btn");
  btn.hidden = view.fab === false;
  if (btn.hidden) closeAddChooser();
}

function step(dir) {
  currentView().step(dir);
}

function render() {
  if (!state.data) return;
  const view = currentView();
  for (const t of document.querySelectorAll(".tab"))
    t.classList.toggle("active", t.dataset.view === state.view);
  // Only a calendar view has a range to step and calendars to filter.
  const isCalendar = view.chrome === "calendar";
  document.getElementById("filters").hidden = !isCalendar;
  document.querySelector(".nav").hidden = !isCalendar;
  syncAddButton(view);
  if (isCalendar) renderFilters();
  view.render();
}

function renderFilters() {
  const el = document.getElementById("filters");
  const cals = (state.data && state.data.calendar_list) || [];
  el.innerHTML = cals.map(c => {
    const off = state.hidden.has(c.id);
    return `<button class="chip ${off ? "off" : ""}" data-cal="${esc(c.id)}" style="--c:${c.color}"
      title="${off ? "Show" : "Hide"} ${esc(c.summary)} events">
      <span class="dot"></span>${esc(c.summary)}</button>`;
  }).join("");
}

function renderSync() {
  const el = document.getElementById("sync"); const s = state.data || {};
  if (s.sync_status === "error") {
    el.innerHTML = `<span style="color:#ff8b8b">sync error: ${esc(s.error || "")}</span>`; return;
  }
  if (!s.last_sync) { el.textContent = "syncing…"; return; }
  const mins = Math.floor((Date.now() - new Date(s.last_sync).getTime()) / 60000);
  el.textContent = `synced ${mins < 1 ? "just now" : mins + " min ago"}`;
}

function tickNow() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: false });
  document.getElementById("date").textContent =
    now.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
}

/* Reload when the server is running a newer build than this page was loaded
   with, so an always-on wallboard display picks up UI changes unattended. */
const VERSION_KEY = "wallboard.version";
const RELOADED_KEY = "wallboard.reloadedFor";
function checkVersion(v) {
  if (!v) return;
  let prev = null;
  try { prev = localStorage.getItem(VERSION_KEY); } catch (e) {}
  if (prev && prev !== v) {
    // Record the new version BEFORE reloading. If we reload first, localStorage
    // still holds the old value on the next load, the mismatch repeats, and the
    // page reloads forever.
    try { localStorage.setItem(VERSION_KEY, v); } catch (e) {}
    // Backstop: at most one reload per version per tab, so a bad state can
    // never turn into a reload storm against the server.
    let tried = null;
    try { tried = sessionStorage.getItem(RELOADED_KEY); } catch (e) {}
    if (tried === v) return;
    try { sessionStorage.setItem(RELOADED_KEY, v); } catch (e) {}
    location.reload();
    return;
  }
  try { localStorage.setItem(VERSION_KEY, v); } catch (e) {}
}

async function poll() {
  try {
    // No cache:"no-store": we want the browser to revalidate against our ETag so
    // an unchanged poll sends If-None-Match and the server answers 304 with no
    // body (~380KB saved every poll). The browser resolves that into a normal 200
    // served from cache, so there is no 304 to check for in JS.
    const res = await fetch("/api/state");
    if (!res.ok) throw new Error(`API ${res.status}`);
    state.data = await res.json();
    checkVersion(state.data.version);
    if (!state.cursor) state.cursor = todayKey();
    render(); renderSync();
  } catch (e) {
    document.getElementById("main").innerHTML =
      `<div class="error">could not reach the wallboard API (${esc(e.message)})</div>`;
  }
}

buildTabs();
document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest("[data-cal]");
  if (!b) return;
  const id = b.dataset.cal;
  if (state.hidden.has(id)) state.hidden.delete(id); else state.hidden.add(id);
  render();
});
document.getElementById("prev").onclick = () => { step(-1); render(); };
document.getElementById("next").onclick = () => { step(1); render(); };
document.getElementById("today").onclick = () => { state.cursor = todayKey(); render(); };
// The add control always offers the same menu, so nothing here depends on which
// tab is showing. That also means a view can opt out with `fab: false` and a new
// tab gets a working + for free. Pressing it again puts the menu away.
document.getElementById("add-btn").onclick = (e) => {
  e.stopPropagation();
  const menu = document.getElementById("add-menu");
  if (menu.hidden) openAddChooser(); else closeAddChooser();
};
// No backdrop to click, so a click anywhere outside stands in for one. A tab
// click lands here too, which is why switching views dismisses the menu without
// the render path having to know the menu exists.
document.addEventListener("click", (e) => {
  const menu = document.getElementById("add-menu");
  if (menu.hidden) return;
  if (menu.contains(e.target) || e.target.closest("#add-btn")) return;
  closeAddChooser();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    // The menu is the outermost thing open, so Escape unwinds it first.
    if (!document.getElementById("add-menu").hidden) { closeAddChooser(); return; }
    closeModal();
  }
  else if (e.key === "ArrowLeft") { step(-1); render(); }
  else if (e.key === "ArrowRight") { step(1); render(); }
});
document.getElementById("main").addEventListener("click", e => {
  const hit = e.target.closest("[data-id]");
  if (hit) { openEvent(findEvent(hit.dataset.id)); return; }
  const more = e.target.closest(".mo-more");
  if (more) { state.cursor = more.dataset.day; state.view = "agenda"; render(); }
});
document.getElementById("main").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    const hit = e.target.closest("[data-id]");
    if (hit) { e.preventDefault(); openEvent(findEvent(hit.dataset.id)); }
  }
});

tickNow(); setInterval(tickNow, 1000);
poll(); setInterval(poll, POLL_MS);
</script>
</body>
</html>
